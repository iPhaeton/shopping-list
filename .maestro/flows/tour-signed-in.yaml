# Screenshots every signed-in screen as the seeded owner (Groceries with a binned item, Sam writing
# and Priya reading; "Birthday party" shared read-only; Jordan, Jorge and Jorja to suggest). Starts on Lists. Pass THEME (day or night, used in
# file names). Screenshots go to <--test-output-dir>/takeScreenshot/.
appId: com.shoppingloop.app
---
- extendedWaitUntil:
    visible: Groceries
    timeout: 15000
- takeScreenshot: lists-${THEME}

- tapOn: Groceries
# Search holds the slot at rest (task 24 step 3), so the field marks the rows as loaded.
- extendedWaitUntil:
    visible: Search items
    timeout: 10000
- tapOn: Show deleted
- takeScreenshot: list-detail-bin-shown-${THEME}
- tapOn: Show deleted
- tapOn: Rename list
- takeScreenshot: list-detail-rename-open-${THEME}
- tapOn: Rename list

- tapOn: Share list
- extendedWaitUntil:
    visible: Sam
    timeout: 10000
- takeScreenshot: sharing-${THEME}
# The owner's Remove confirm, on the member's card.
- tapOn: Remove Sam
- takeScreenshot: sharing-remove-${THEME}
- tapOn: Cancel
# The invite field's suggestions, then the field emptied again. A fresh stack's seed answers "Jor"
# with Jordan, Jorge and Jorja; a stack also holding generated users may answer with theirs.
- tapOn: Name
- waitForAnimationToEnd
- inputText: Jor
- extendedWaitUntil:
    visible: "Share with .*"
    timeout: 15000
- takeScreenshot: sharing-suggestions-${THEME}
# Picked: the role picker shows in the header's strip and Share goes live. Nothing is shared.
- tapOn: "Share with .*"
- takeScreenshot: sharing-picked-${THEME}
# The keyboard stays up — `hideKeyboard` on iOS swipes the content — and covers nothing tapped next:
# the header, Back included, is pinned at the top.
- eraseText
# Every screen draws its own `Back`, and Maestro's `back` is Android-only. On Sharing, List detail's
# `Back` is still in the hierarchy underneath, so tap Sharing's by where it is drawn.
- tapOn:
    point: "10%,9%"
- tapOn: Back

- tapOn: Birthday party, shared with you
- extendedWaitUntil:
    visible: Candles
    timeout: 10000
- takeScreenshot: list-detail-read-only-${THEME}
# The same list's roster as a reader sees it, with their own Leave confirm open.
- tapOn: Share list
- extendedWaitUntil:
    visible: Leave list
    timeout: 10000
# `Leave list` shows before the push ends; a shot then catches the screen mid-slide, corners rounded.
- waitForAnimationToEnd
- takeScreenshot: sharing-member-${THEME}
- tapOn: Leave list
- takeScreenshot: sharing-leave-${THEME}
- tapOn: Cancel
- tapOn:
    point: "10%,9%"
- tapOn: Back

- tapOn: Account
- takeScreenshot: account-${THEME}
# Editing the name, and the sign-out-everywhere confirm, together as the editing mockup draws them.
- tapOn: Edit name
- tapOn: Sign out of all devices
- takeScreenshot: account-editing-${THEME}
- tapOn: Cancel editing name
- tapOn: Cancel
- tapOn: Back
